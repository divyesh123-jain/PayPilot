services:
  - type: web
    name: paypilot-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: PAYMENT_MODE
        value: mock
      - key: NODE_VERSION
        value: 20.17.0
      - key: PORT
        value: 8080

  - type: web
    name: paypilot-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.17.0
      - key: NEXT_PUBLIC_PAYPILOT_API_URL
        fromService:
          type: web
          name: paypilot-api
          property: host

databases:
  - name: paypilot-db
    plan: free
    databaseName: paypilot
    user: paypilot
