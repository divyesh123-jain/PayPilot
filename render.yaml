services:
  - type: web
    name: paypilot-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PAYMENT_MODE
        value: mock
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: paypilot-db
          property: connectionString

  - type: web
    name: paypilot-web
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NEXT_PUBLIC_PAYPILOT_API_URL
        fromService:
          type: web
          name: paypilot-api
          property: host

databases:
  - name: paypilot-db
    plan: free
